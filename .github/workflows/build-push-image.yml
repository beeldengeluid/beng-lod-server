name: Build & Push

on:
  push:
    branches:
    - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push-image:
    uses: beeldengeluid/gha-workflows/.github/workflows/build-push-image.yml@3a0e0f197dd27fd7e7e5a553afc55e1ccb833200 # v2026.10.15
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
