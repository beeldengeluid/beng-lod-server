name: Build & Push

on:
  push:
    branches:
    - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push-image:
    uses: beeldengeluid/gha-workflows/.github/workflows/build-push-image.yml@afa10f99e5a241e0d45da4aced040cb8df745640 # v2026.07.24
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
