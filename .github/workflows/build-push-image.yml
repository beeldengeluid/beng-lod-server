name: Build & Push

on:
  push:
    branches:
    - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push-image:
    uses: beeldengeluid/gha-workflows/.github/workflows/build-push-image.yml@de5075b255a9aadcbe9596b7c03557850e8688f9 # v2026.10.07
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
