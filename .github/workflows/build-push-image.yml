name: Build & Push

on:
  push:
    branches:
    - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push-image:
    uses: beeldengeluid/gha-workflows/.github/workflows/build-push-image.yml@dd630d66cfac198c4b654eeb8dca6416ec4d5336 # v2026.10.30
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
