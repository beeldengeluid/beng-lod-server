name: Build & Push

on:
  push:
    branches:
    - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push-image:
    uses: beeldengeluid/gha-workflows/.github/workflows/build-push-image.yml@82ef4b65f05f0a71a8601368769e1f8eb70d9d00 # v2026.09.07
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
