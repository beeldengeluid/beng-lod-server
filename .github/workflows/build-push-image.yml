name: Build & Push

on:
  push:
    branches:
    - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push-image:
    uses: beeldengeluid/gha-workflows/.github/workflows/build-push-image.yml@7e2a13e12af5ae6e9c431f541297f8d8d37c073e # v2026.09.25
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
