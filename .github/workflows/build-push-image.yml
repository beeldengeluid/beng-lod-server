name: Build & Push

on:
  push:
    branches:
    - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push-image:
    uses: beeldengeluid/gha-workflows/.github/workflows/build-push-image.yml@61643c97510e9ff3d4b6654b6a6111dfaea5bced # v2026.07.31
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
