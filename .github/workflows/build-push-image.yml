name: Build & Push

on:
  push:
    branches:
    - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push-image:
    uses: beeldengeluid/gha-workflows/.github/workflows/build-push-image.yml@6f7fc0be276ca8a7872cd12f8b55111e1943f298 # v2026.08.12
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
