name: Build & Push

on:
  push:
    branches:
    - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push-image:
    uses: beeldengeluid/gha-workflows/.github/workflows/build-push-image.yml@06e8f266836216a02b84dec2fb8a21b78c56b356 # v2026.08.05
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
