name: Build & Push

on:
  push:
    branches:
    - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push-image:
    uses: beeldengeluid/gha-workflows/.github/workflows/build-push-image.yml@faa70db2b67c99bd158309019b9762d8957f6cc0 # v2026.11.12
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
