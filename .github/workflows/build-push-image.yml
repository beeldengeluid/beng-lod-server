name: Build & Push

on:
  push:
    branches:
    - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push-image:
    uses: beeldengeluid/gha-workflows/.github/workflows/build-push-image.yml@04eae514d417695ac13622a163dcd5750d1bb739 # v2026.08.27
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
